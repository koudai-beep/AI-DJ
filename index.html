<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI DJ v2 - Spotify Test</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--card:#141821;--muted:#98a2b3;--line:#2a3140;--accent:#1ed760;--danger:#ff6b6b}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:linear-gradient(180deg,#090b10,#0d1118);color:#f8fafc}
main{max-width:720px;margin:auto;padding:24px 16px 48px}
h1{font-size:28px;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 10px 30px #0004}
label{display:block;font-weight:700;margin-bottom:8px} input{width:100%;border:1px solid var(--line);background:#0c1118;color:#fff;border-radius:12px;padding:14px;font-size:16px}
button,a.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:800;text-align:center;text-decoration:none;margin-top:12px}
.primary{background:var(--accent);color:#05150a}.secondary{background:#242b38;color:#fff}.ghost{background:transparent;color:#fff;border:1px solid var(--line)}
.small{font-size:13px;color:var(--muted);line-height:1.5}.ok{color:#6ee7a2}.bad{color:#ff8c8c}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
#log{white-space:pre-wrap;background:#090d13;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:74px;color:#cbd5e1;font-size:13px}
.track{padding:10px 0;border-bottom:1px solid var(--line)} .track:last-child{border-bottom:0}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#243022;color:#8ff0b0;font-size:12px;font-weight:800}
</style>
</head>
<body>
<main>
  <h1>AI DJ v2</h1>
  <p class="sub">まずは Spotify 接続とプレイリスト作成だけをテストします。</p>

  <section class="card">
    <div class="badge">STEP 1</div>
    <h2>Spotify Client ID</h2>
    <label for="clientId">Client ID</label>
    <input id="clientId" autocomplete="off" placeholder="Spotify Developer の Client ID">
    <p class="small">Client Secretは入力しません。Client IDだけをこの端末のlocalStorageに保存します。</p>
    <button id="connectBtn" class="primary">Spotifyに接続</button>
    <button id="disconnectBtn" class="ghost">接続を解除</button>
    <p id="status" class="small">未接続</p>
  </section>

  <section class="card">
    <div class="badge">STEP 2</div>
    <h2>接続テスト</h2>
    <p class="small">3曲をSpotifyで検索し、非公開プレイリスト「AI DJ TEST」を自動作成します。これが成功すれば、次に自動選曲エンジンを載せられます。</p>
    <button id="testBtn" class="secondary" disabled>AI DJ TESTを作成</button>
    <div id="tracks"></div>
    <a id="playlistLink" class="btn primary" style="display:none" target="_blank" rel="noopener">Spotifyで開く</a>
  </section>

  <section class="card">
    <h2>ログ</h2>
    <div id="log">待機中...</div>
  </section>
</main>

<script>
const REDIRECT_URI = "https://koudai-beep.github.io/AI-DJ/";
const SCOPES = "playlist-modify-private user-read-private";
const API = "https://api.spotify.com/v1";

const $ = s => document.querySelector(s);
const logEl = $("#log");
const statusEl = $("#status");
const clientIdEl = $("#clientId");
const testBtn = $("#testBtn");
const tracksEl = $("#tracks");
const playlistLink = $("#playlistLink");

clientIdEl.value = localStorage.getItem("spotify_client_id") || "";

function log(msg){
  const stamp = new Date().toLocaleTimeString("ja-JP");
  logEl.textContent = `[${stamp}] ${msg}\n` + (logEl.textContent === "待機中..." ? "" : logEl.textContent);
}
function b64url(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/=/g,"").replace(/\+/g,"-").replace(/\//g,"_");
}
function randomString(n=64){
  const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
  const a=crypto.getRandomValues(new Uint8Array(n));
  return Array.from(a,x=>chars[x%chars.length]).join("");
}
async function sha256(s){
  return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
}
function token(){ return sessionStorage.getItem("spotify_access_token") || ""; }

async function api(path, opts={}){
  const t=token();
  if(!t) throw new Error("Spotifyに接続されていません");
  const res=await fetch(API+path,{
    ...opts,
    headers:{
      "Authorization":"Bearer "+t,
      ...(opts.body ? {"Content-Type":"application/json"} : {}),
      ...(opts.headers||{})
    }
  });
  if(res.status===204) return null;
  let body=null;
  try{ body=await res.json(); }catch{}
  if(!res.ok){
    const msg=body?.error?.message || body?.error || `${res.status} ${res.statusText}`;
    throw new Error(msg);
  }
  return body;
}

async function connect(){
  const clientId=clientIdEl.value.trim();
  if(!clientId){ alert("Client IDを貼り付けてください"); return; }
  localStorage.setItem("spotify_client_id",clientId);

  const verifier=randomString(64);
  const challenge=b64url(await sha256(verifier));
  const state=randomString(24);
  localStorage.setItem("spotify_pkce_verifier",verifier);
  localStorage.setItem("spotify_oauth_state",state);

  const u=new URL("https://accounts.spotify.com/authorize");
  u.search=new URLSearchParams({
    response_type:"code",
    client_id:clientId,
    scope:SCOPES,
    redirect_uri:REDIRECT_URI,
    code_challenge_method:"S256",
    code_challenge:challenge,
    state
  }).toString();
  location.href=u.toString();
}

async function exchangeCode(){
  const p=new URLSearchParams(location.search);
  const code=p.get("code");
  const err=p.get("error");
  if(err){ log("Spotify認証エラー: "+err); history.replaceState({}, "", REDIRECT_URI); return; }
  if(!code) return;

  const returnedState=p.get("state");
  const savedState=localStorage.getItem("spotify_oauth_state");
  if(!savedState || returnedState!==savedState) throw new Error("OAuth stateが一致しません");

  const clientId=localStorage.getItem("spotify_client_id");
  const verifier=localStorage.getItem("spotify_pkce_verifier");
  if(!clientId || !verifier) throw new Error("PKCE情報が見つかりません。もう一度接続してください");

  log("認証コードをアクセストークンに交換中...");
  const res=await fetch("https://accounts.spotify.com/api/token",{
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({
      client_id:clientId,
      grant_type:"authorization_code",
      code,
      redirect_uri:REDIRECT_URI,
      code_verifier:verifier
    })
  });
  const body=await res.json();
  if(!res.ok) throw new Error(body.error_description || body.error || "トークン交換に失敗しました");
  sessionStorage.setItem("spotify_access_token",body.access_token);
  localStorage.removeItem("spotify_pkce_verifier");
  localStorage.removeItem("spotify_oauth_state");
  history.replaceState({}, "", REDIRECT_URI);
  log("Spotify認証成功");
}

async function refreshStatus(){
  if(!token()){
    statusEl.textContent="未接続";
    statusEl.className="small";
    testBtn.disabled=true;
    return;
  }
  try{
    const me=await api("/me");
    statusEl.textContent=`接続済み: ${me.display_name || me.id}`;
    statusEl.className="small ok";
    testBtn.disabled=false;
    log("Spotify API 接続確認OK");
  }catch(e){
    statusEl.textContent="接続確認に失敗: "+e.message;
    statusEl.className="small bad";
    testBtn.disabled=true;
  }
}

async function searchTrack(query){
  const r=await api("/search?q="+encodeURIComponent(query)+"&type=track&limit=5");
  return r?.tracks?.items?.[0] || null;
}

async function makeTestPlaylist(){
  testBtn.disabled=true;
  playlistLink.style.display="none";
  tracksEl.innerHTML="";
  try{
    const queries=[
      "Limonène pop music",
      "kamome sano sweet syrup",
      "Mameyudoufu ENDLESS CIDER Such"
    ];
    log("3曲をSpotifyで検索中...");
    const found=[];
    for(const q of queries){
      const t=await searchTrack(q);
      if(t) found.push(t);
      await new Promise(r=>setTimeout(r,150));
    }
    if(!found.length) throw new Error("曲を1つも検索できませんでした");

    tracksEl.innerHTML=found.map(t=>`<div class="track"><b>${escapeHtml(t.name)}</b><br><span class="small">${escapeHtml((t.artists||[]).map(a=>a.name).join(", "))}</span></div>`).join("");

    log("非公開プレイリストを作成中...");
    const pl=await api("/me/playlists",{
      method:"POST",
      body:JSON.stringify({
        name:"AI DJ TEST",
        public:false,
        description:"AI DJ v2 Spotify connection test"
      })
    });

    log("検索した曲をプレイリストへ追加中...");
    await api(`/playlists/${encodeURIComponent(pl.id)}/items`,{
      method:"POST",
      body:JSON.stringify({uris:found.map(t=>t.uri)})
    });

    playlistLink.href=pl.external_urls?.spotify || `https://open.spotify.com/playlist/${pl.id}`;
    playlistLink.style.display="block";
    log(`成功: AI DJ TEST を作成しました（${found.length}曲）`);
  }catch(e){
    log("失敗: "+e.message);
    alert("エラー: "+e.message);
  }finally{
    testBtn.disabled=!token();
  }
}

function escapeHtml(s=""){
  return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

$("#connectBtn").addEventListener("click",connect);
$("#disconnectBtn").addEventListener("click",()=>{
  sessionStorage.removeItem("spotify_access_token");
  statusEl.textContent="未接続";
  statusEl.className="small";
  testBtn.disabled=true;
  log("Spotify接続を解除しました");
});
testBtn.addEventListener("click",makeTestPlaylist);

(async()=>{
  try{
    await exchangeCode();
  }catch(e){
    log("認証処理失敗: "+e.message);
  }
  await refreshStatus();
})();
</script>
</body>
</html>
